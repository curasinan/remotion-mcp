name: pages

# Publishes site/ - a single hand-written HTML file, no build step, no
# dependencies - to GitHub Pages via the official artifact flow.
#
# On id-token: write, deliberately the second workflow to hold it (release.yml
# is the first, and its isolation argument still stands): deploy-pages
# exchanges the OIDC token for a deployment token scoped to Pages only. This
# workflow holds no contents: write, runs only on pushes to main - which the
# protect-main ruleset gates behind a PR and ci-ok - and on manual dispatch,
# and the content it publishes is the repository's own site/ directory. A
# workflow that can publish a website is not a workflow that can sign a
# release or push code.
#
# Every action is SHA-pinned with the readable version alongside, per the
# policy note at the top of ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest site matters: a superseded deploy of an older commit is
# waste, not loss - unlike release.yml, where cancel-in-progress would risk a
# half-finished release.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
