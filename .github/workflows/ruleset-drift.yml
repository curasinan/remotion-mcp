name: ruleset-drift

# The release flow is: briefly set the protect-main ruleset to "disabled",
# push the releasing commit, re-enable it (the GitHub Actions app cannot be a
# ruleset bypass actor on a user-owned repository, so the semantic-release
# push has no standing exemption - by decision, not omission). The one failure
# mode of a manual toggle is forgetting the second half, and that failure is
# silent: main would sit unprotected indefinitely. This workflow turns the
# silence into a red run every morning - assert the ruleset is enforcing,
# fail if it is not. If the ruleset was deleted outright, the API call itself
# 404s and the step fails the same way, which is the alarm doing its job.
#
# No actions, no checkout, no dependencies: one API read with the run's own
# token, so there is nothing here to SHA-pin.
#
# Known residual, stated rather than hidden: GitHub disables scheduled
# workflows after ~60 days without repository activity (an email warning comes
# first), so this alarm can itself go quiet on a dormant repo.
# workflow_dispatch stays available to fire it by hand.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # $GITHUB_REPOSITORY rather than an interpolated expression, for the same
      # reason release.yml reads its identity from the environment: nothing
      # outside this file gets spliced into a run block. 22037340 is the
      # protect-main ruleset created 2026-09-01. If it is ever recreated under
      # a new id this fails with a 404 - correct behaviour, and the fix is to
      # update the id here in the same change that recreated it.
      - name: Assert protect-main is enforcing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/22037340" --jq .enforcement)
          echo "protect-main enforcement=$state"
          [ "$state" = "active" ] || {
            echo "::error::protect-main is '$state', not 'active'. A release toggle was probably not undone. Re-enable it: Settings -> Rules -> protect-main, or: gh api -X PUT repos/$GITHUB_REPOSITORY/rulesets/22037340 -f enforcement=active"
            exit 1
          }
