name: Release

# Kept separate from ci.yml so the signing token is never available to pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release; let @semantic-release/git push the version bump
  issues: write # @semantic-release/github comments on the issues a release closes
  pull-requests: write # ...and on pull requests, which `issues: write` alone does not cover
  id-token: write # OIDC token for cosign keyless signing

# One release at a time; queue instead of cancelling a running one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the whole tag history
          # semantic-release authenticates with GITHUB_TOKEN on its own.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Satisfies both semantic-release 25 and @semantic-release/git 11.
          node-version: 24
          cache: npm

      - run: npm ci

      # Test gate: ci.yml runs in parallel, so a failing commit must not be released.
      - name: Type-check
        run: npm run typecheck

      # Build for the tests; prepareCmd rebuilds the release artifact.
      - name: Build
        run: npm run build

      # Browser tests skip without Chrome, so fail early if the runner has none.
      - name: Assert a browser is available
        run: >
          node -e "import('./dist/services/browser.js').then(async m => {
          const l = await m.locateBrowser();
          console.log('browser:', l.source, l.executablePath || '');
          if (l.source === 'none') {
          console.error('No browser found. test/html.test.mjs would skip silently, so this release gate would pass without exercising viz_render_html.');
          console.error('Install one in this job (ubuntu: sudo apt-get install -y google-chrome-stable) or set PUPPETEER_EXECUTABLE_PATH.');
          process.exit(1); } })"

      - name: Test
        run: npm test
        env:
          # Same raised page deadline as ci.yml.
          REMOTION_MCP_PAGE_TIMEOUT_MS: "90000"

      # prepareCmd syncs the version, builds, bundles and runs the size gate.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release commits are authored by the maintainer instead of semantic-release-bot.
          GIT_AUTHOR_NAME: Curasinan
          GIT_AUTHOR_EMAIL: curasinan9@gmail.com
          GIT_COMMITTER_NAME: Curasinan
          GIT_COMMITTER_EMAIL: curasinan9@gmail.com
        run: npx semantic-release

      # The steps below only run when semantic-release produced a bundle.
      - name: Install cosign
        if: hashFiles('*.mcpb') != ''
        # v3 installs cosign 2.x, which keeps the detached .sig/.pem output used below.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the bundle and attach the signature to the release
        if: hashFiles('*.mcpb') != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Require exactly one bundle.
          shopt -s nullglob
          bundles=(*.mcpb)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one .mcpb in the workspace, found ${#bundles[@]}:" >&2
            printf '  %s\n' "${bundles[@]:-(none)}" >&2
            exit 1
          fi
          BUNDLE="${bundles[0]}"

          # Keyless signing; the signature is recorded in the Rekor transparency log.
          cosign sign-blob --yes \
            --output-signature "${BUNDLE}.sig" \
            --output-certificate "${BUNDLE}.pem" \
            "$BUNDLE"

          # Verify before upload; keep this identity in sync with README "Verifying a release".
          cosign verify-blob \
            --certificate "${BUNDLE}.pem" \
            --signature "${BUNDLE}.sig" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$BUNDLE"

          # semantic-release tags as v<version>.
          TAG="v$(jq -r .version package.json)"
          gh release upload "$TAG" "${BUNDLE}.sig" "${BUNDLE}.pem" --clobber

          echo "Signed ${BUNDLE} and attached ${BUNDLE}.sig and ${BUNDLE}.pem to ${TAG}."
