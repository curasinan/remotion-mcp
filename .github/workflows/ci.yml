name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Actions are pinned to commit SHAs; bump the SHA and its version comment together.

# Read-only token; only release.yml gets write scopes.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Browser tests skip without Chrome, so fail early if the runner has none.
      - name: Assert a browser is available
        run: >
          node -e "import('./dist/services/browser.js').then(async m => {
          const l = await m.locateBrowser();
          console.log('browser:', l.source, l.executablePath || '');
          if (l.source === 'none') {
          console.error('No browser found. test/html.test.mjs would skip silently, leaving viz_render_html untested on this leg.');
          console.error('Install one in this job (ubuntu: sudo apt-get install -y google-chrome-stable) or set PUPPETEER_EXECUTABLE_PATH.');
          process.exit(1); } })"

      # The coverage leg runs the suite once via test:coverage instead.
      - name: Test
        # Quoted because a leading `!` is a YAML tag.
        if: "!(matrix.os == 'ubuntu-latest' && matrix.node == 24)"
        run: npm test
        env:
          # Shared runners are slow to start Chrome; raise the 45 s page deadline.
          REMOTION_MCP_PAGE_TIMEOUT_MS: "90000"

      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
        env:
          REMOTION_MCP_PAGE_TIMEOUT_MS: "90000"

      # Check tools/list with an independent client (pinned); update the count when adding a tool.
      - name: MCP conformance (independent client)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npx -y @modelcontextprotocol/inspector@2.4.0 --cli node dist/index.js \
            --method tools/list > inspector-tools.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('inspector-tools.json','utf8'));
            const tools = r.tools ?? r;
            if (!Array.isArray(tools)) { console.error('no tools array'); process.exit(1); }
            if (tools.length !== 13) {
              console.error('expected 13 tools, got ' + tools.length + ': ' + tools.map(t=>t.name).join(','));
              process.exit(1);
            }
            for (const t of tools) {
              if (!t.name || !t.description || !t.inputSchema) {
                console.error('tool missing required field: ' + JSON.stringify(t).slice(0,200));
                process.exit(1);
              }
            }
            console.log('conformance OK: ' + tools.length + ' tools');
          "
        env:
          REMOTION_MCP_WORKSPACE: ${{ github.workspace }}

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run lint

      # Fail only on critical advisories; known unreachable ones are listed in docs/BUNDLE.md.
      - name: Audit (gate on critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit (full report, informational)
        run: npm audit --omit=dev || true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json

      # Advisory scan; reports CRITICAL/HIGH findings without failing the build.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'          # advisory
          format: table

      # SPDX SBOM; the action uploads its own artifact, so the name must differ from "sbom".
      - name: SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

  # Build the .mcpb once (it carries every platform's binary) and check its contents.
  bundle:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle

      # Compare against scripts/bundle-size-baseline.json.
      - name: Bundle size gate
        run: node scripts/check-bundle-size.mjs

      - name: Verify the bundle
        run: npm run test:bundle
        env:
          # Fail instead of skipping when the bundle is missing.
          REQUIRE_BUNDLE: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Keep the long-lived copy for main only.
        if: github.ref == 'refs/heads/main'
        with:
          name: mcpb-bundle
          path: '*.mcpb'
          retention-days: 30

      # Short-lived copy for verify-bundle, uploaded on every run including PRs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-runtime
          path: '*.mcpb'
          retention-days: 1

  # Load the shipped bundle on each platform it supports; one native binary per leg.
  verify-bundle:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest     # loads @resvg/resvg-js-linux-x64-gnu
          - os: ubuntu-24.04-arm  # loads @resvg/resvg-js-linux-arm64-gnu
          - os: windows-latest    # loads @resvg/resvg-js-win32-x64-msvc
          - os: windows-11-arm    # loads @resvg/resvg-js-win32-arm64-msvc
          - os: macos-latest      # loads @resvg/resvg-js-darwin-arm64
          - os: macos-15-intel    # loads @resvg/resvg-js-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Active LTS; the minimum version is covered by build-and-test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb-runtime
          path: artifact

      # Plain node call so it behaves the same on Windows shells.
      - name: Run the shipped artifact
        run: node scripts/verify-bundle-runtime.mjs ./artifact ./extracted

  # Lint every workflow with actionlint (image pinned by digest).
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # Single required status check; always runs and fails if any needed job did not succeed.
  ci-ok:
    needs: [build-and-test, sbom, bundle, verify-bundle, lint-workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e "
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, v]) => v.result !== 'success');
            if (bad.length > 0) {
              console.error('jobs that did not succeed: ' + bad.map(([k, v]) => k + '=' + v.result).join(', '));
              process.exit(1);
            }
            console.log('all ' + Object.keys(needs).length + ' required jobs succeeded');
          "
